<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 600" width="1128" height="600" role="img" aria-labelledby="t d">
<title id="t">trunk-kuli architecture</title>
<desc id="d">Classified local files pass through a boundary that stamps and filters them before any model sees them. The model is one of several interchangeable providers. Everything it produces must pass a wall of gates that are programs rather than prompts. A trail records every action from outside the agent.</desc>

<style>
  .lbl { font: 10.5px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1d1d; }
  .sm  { font: 9px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5a5a5a; }
  .hd  { font: 600 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1d1d; }
  .ttl { font: 600 18px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1d1d1d; }
  .sub { font: 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5a5a5a; }
  .box { fill: #fff; stroke: #c8c8c8; stroke-width: 1.2; }
  .built { fill: #fff; stroke: #1d1d1d; stroke-width: 1.6; }
  .spec  { fill: #fff; stroke: #b4b4b4; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .panel { fill: #fafafa; stroke: #e0e0e0; stroke-width: 1; }
  .chip  { fill: #f4f6fa; stroke: #b9c6dd; stroke-width: 1.1; }
  .flow  { stroke: #1d1d1d; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  .back  { stroke: #8a8a8a; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3; marker-end: url(#g); }
  .bound { stroke: #c0392b; stroke-width: 1.4; stroke-dasharray: 6 4; }
  .red   { fill: #c0392b; }
</style>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1d"/>
  </marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
  </marker>
</defs>

<rect width="1128" height="600" fill="#fff"/>

<text x="20" y="30" class="ttl">trunk-kuli — the model is replaceable, the process is not</text>
<text x="20" y="50" class="sub">A harness is not a prompt. A gate is a program that reads the repository and exits non-zero.</text>

<!-- ─────────── 1 · brain ─────────── -->
<rect x="20" y="78" width="190" height="352" rx="4" class="panel"/>
<text x="32" y="98" class="hd">1 · Brain, held locally</text>

<rect x="32" y="110" width="166" height="30" rx="3" class="box"/>
<text x="42" y="124" class="lbl">L0 · public</text>
<text x="42" y="135" class="sm">any provider</text>

<rect x="32" y="146" width="166" height="30" rx="3" class="box"/>
<text x="42" y="160" class="lbl">L1 · internal</text>
<text x="42" y="171" class="sm">any provider</text>

<rect x="32" y="182" width="166" height="30" rx="3" class="box"/>
<text x="42" y="196" class="lbl">L2 · confidential</text>
<text x="42" y="207" class="sm">local model only</text>

<rect x="32" y="218" width="166" height="32" rx="3" class="built"/>
<text x="42" y="232" class="lbl">L3 · secret</text>
<text x="42" y="243" class="sm red">no model, ever</text>

<text x="32" y="272" class="sm">Unclassified defaults to L2.</text>
<text x="32" y="286" class="sm">Only a person may lower a level.</text>

<rect x="32" y="302" width="166" height="48" rx="3" class="spec"/>
<text x="42" y="318" class="lbl">Credential proxy</text>
<text x="42" y="331" class="sm">holds L3, injects it into</text>
<text x="42" y="343" class="sm">outgoing requests</text>

<!-- ─────────── boundary ─────────── -->
<line x1="223" y1="72" x2="223" y2="440" class="bound"/>
<text x="228" y="70" class="sm red">classification boundary</text>

<!-- ─────────── 2 · what a model may see ─────────── -->
<rect x="236" y="78" width="200" height="352" rx="4" class="panel"/>
<text x="248" y="98" class="hd">2 · What a model may see</text>

<rect x="248" y="112" width="176" height="76" rx="3" class="spec"/>
<text x="258" y="129" class="lbl">Context assembler</text>
<text x="258" y="144" class="sm">builds a bundle, stamped</text>
<text x="258" y="156" class="sm">with its highest level</text>
<text x="258" y="174" class="sm red">refuses — never downgrades</text>

<rect x="248" y="206" width="176" height="88" rx="3" class="spec"/>
<text x="258" y="223" class="lbl">Return-path check</text>
<text x="258" y="238" class="sm">every tool result is</text>
<text x="258" y="250" class="sm">classified again before it</text>
<text x="258" y="262" class="sm">re-enters the context</text>
<text x="258" y="281" class="sm red">the leak people forget</text>

<text x="248" y="320" class="sm">A model does not leak by</text>
<text x="248" y="333" class="sm">reading. It leaks by calling</text>
<text x="248" y="346" class="sm">a tool and getting an answer.</text>

<!-- ─────────── 3 · models ─────────── -->
<rect x="462" y="78" width="180" height="352" rx="4" class="panel"/>
<text x="474" y="98" class="hd">3 · Models, interchangeable</text>

<rect x="474" y="112" width="156" height="44" rx="3" class="chip"/>
<text x="484" y="129" class="lbl">Claude Code</text>
<text x="484" y="145" class="sm">agent product · wrapped · L1</text>

<rect x="474" y="166" width="156" height="44" rx="3" class="chip"/>
<text x="484" y="183" class="lbl">Gemini / Grok</text>
<text x="484" y="199" class="sm">raw model · kuli's loop · L1</text>

<rect x="474" y="220" width="156" height="44" rx="3" class="chip"/>
<text x="484" y="237" class="lbl">Local model</text>
<text x="484" y="253" class="sm">loopback verified · L2</text>

<text x="474" y="286" class="sm">Two adapters, not five:</text>
<text x="474" y="299" class="sm">everything else is a config row.</text>

<text x="474" y="322" class="sm">Swap any of these and nothing</text>
<text x="474" y="335" class="sm">to the right of here changes.</text>
<text x="474" y="356" class="sm">A provider is admitted only by</text>
<text x="474" y="369" class="sm">being refused by the same gate,</text>
<text x="474" y="382" class="sm">for the same reason, as the rest.</text>

<!-- ─────────── 4 · gates ─────────── -->
<rect x="668" y="78" width="234" height="352" rx="4" class="panel"/>
<text x="680" y="98" class="hd">4 · Gates — code, not prompts</text>

<rect x="680" y="110" width="210" height="30" rx="3" class="built"/>
<text x="690" y="123" class="lbl">Ratchet</text>
<text x="690" y="134" class="sm">nothing may get worse · built</text>

<rect x="680" y="146" width="210" height="30" rx="3" class="built"/>
<text x="690" y="159" class="lbl">Review cost</text>
<text x="690" y="170" class="sm">slop is a ratio · built</text>

<rect x="680" y="182" width="210" height="26" rx="3" class="spec"/>
<text x="690" y="199" class="lbl">Traceability · both directions</text>

<rect x="680" y="214" width="210" height="26" rx="3" class="spec"/>
<text x="690" y="231" class="lbl">Current API · installed version</text>

<rect x="680" y="246" width="210" height="26" rx="3" class="spec"/>
<text x="690" y="263" class="lbl">Spec · test · scope · standard</text>

<rect x="680" y="278" width="210" height="26" rx="3" class="spec"/>
<text x="690" y="295" class="lbl">Absence · what must not exist</text>

<rect x="680" y="310" width="210" height="26" rx="3" class="spec"/>
<text x="690" y="327" class="lbl">Interface · rendered, not source</text>

<text x="680" y="356" class="sm">Identical whichever model produced</text>
<text x="680" y="369" class="sm">the work. They never learn which</text>
<text x="680" y="382" class="sm">one did.</text>

<!-- ─────────── 5 · what comes out ─────────── -->
<rect x="928" y="78" width="180" height="352" rx="4" class="panel"/>
<text x="940" y="98" class="hd">5 · What comes out</text>

<rect x="940" y="112" width="156" height="44" rx="3" class="spec"/>
<text x="950" y="129" class="lbl">Refused</text>
<text x="950" y="145" class="sm">named, with the refactor</text>

<rect x="940" y="166" width="156" height="58" rx="3" class="spec"/>
<text x="950" y="183" class="lbl">Queued for a person</text>
<text x="950" y="198" class="sm">10:00 and 16:00, batched,</text>
<text x="950" y="211" class="sm">shown not described</text>

<rect x="940" y="234" width="156" height="44" rx="3" class="built"/>
<text x="950" y="251" class="lbl">Evidence</text>
<text x="950" y="267" class="sm">what was proven, committed</text>

<text x="940" y="304" class="sm">Nothing irreversible happens</text>
<text x="940" y="317" class="sm">without the owner — whichever</text>
<text x="940" y="330" class="sm">provider asked.</text>

<!-- ─────────── flows ─────────── -->
<path d="M210,170 L232,170" class="flow"/>
<path d="M436,150 L458,150" class="flow"/>
<path d="M458,242 L438,242" class="back"/>
<path d="M642,196 L664,196" class="flow"/>
<path d="M902,196 L924,196" class="flow"/>

<!-- ─────────── trail ─────────── -->
<rect x="20" y="458" width="1088" height="76" rx="4" class="built"/>
<text x="34" y="479" class="hd">Trail — written by something that is not the agent</text>
<text x="34" y="499" class="sm">Append-only and hash-chained, so an entry cannot be edited or removed quietly. It stores fingerprints, not contents: a write is recorded as its path,</text>
<text x="34" y="513" class="sm">size and SHA-256. That answers who changed what, when, to exactly which bytes — without the audit log becoming the largest leak in the system.</text>
<text x="34" y="527" class="sm">Credentials are removed before anything is hashed. It records everything above and refuses nothing. · built</text>

<path d="M115,434 L115,454" class="flow"/>
<path d="M336,434 L336,454" class="flow"/>
<path d="M552,434 L552,454" class="flow"/>
<path d="M785,434 L785,454" class="flow"/>
<path d="M1018,434 L1018,454" class="flow"/>

<!-- ─────────── legend ─────────── -->
<rect x="20" y="552" width="22" height="12" rx="2" class="built"/>
<text x="50" y="562" class="sm">built and running</text>
<rect x="166" y="552" width="22" height="12" rx="2" class="spec"/>
<text x="196" y="562" class="sm">specified, not yet built</text>
<line x1="352" y1="558" x2="374" y2="558" class="bound"/>
<text x="382" y="562" class="sm">a boundary enforced in code, not by trusting the model</text>
</svg>
